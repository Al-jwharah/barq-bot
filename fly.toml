# Fly.io template for barq always-on worker (Architecture B).
# Do NOT deploy without owner Fly login + secrets.
# Suggested region: fra (Frankfurt) near Vercel fra1 / Neon EU.
#
# Owner steps: see WORKER.md

app = "barq-worker"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/healthz"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

[env]
  PORT = "8080"
  BARQ_REQUIRE_POSTGRES = "on"
  FFMPEG_PATH = "/usr/bin/ffmpeg"
  # Owner should set DOWNLOAD_TIMEOUT_MS ≤ 270000 on the worker (not on Vercel from this branch).
